services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  simulator:
    build: ./simulator
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      - PORT=3000
      - MONGO_URL=mongodb://mongo:27017/live_graph
      - SIMULATOR_URL=http://simulator:8000
    depends_on:
      mongo:
        condition: service_healthy
      simulator:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  mongo_data:
